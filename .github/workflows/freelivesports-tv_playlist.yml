name: FreeLiveSports TV Playlist

on:
  repository_dispatch:
    types: [run-fls-playlist]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: freelivesports-tv
        run: pip install requests

      - name: Generate Playlist
        working-directory: freelivesports-tv
        run: python playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "freelivesports-tv/playlist.m3u"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update FLS Playlist [skip ci]" && git push origin main)
