name: FreeLiveSports TV Playlist

on:
  repository_dispatch:
    types: [run-fls-playlist]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: freelivesports-tv
        run: pip install requests

      - name: Generate Playlist
        working-directory: freelivesports-tv
        run: python playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main --autostash
          git add freelivesports-tv/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update FLS Playlist [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main --autostash && git push origin main && break
              echo "Push rejected, retrying in 3 seconds ($i/5)..."
              sleep 3
            done
          )
