name: Transmedia Playlist

on:
  repository_dispatch:
    types: [run-transmedia-token]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: |
          pip install playwright requests
          playwright install chromium
          python transmedia/fetcher.py
        env:
          GITHUB_TOKEN: ${{ secrets.TRANSMEDIA_TOKEN }}
          GIST_ID: ${{ secrets.GIST_TRANSMEDIA }}
