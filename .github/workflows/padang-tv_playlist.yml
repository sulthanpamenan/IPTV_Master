name: Padang TV Playlist

on:
  repository_dispatch:
    types: [run-padang-playlist]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: padang-tv
        run: |
          python -m pip install --upgrade pip
          pip install streamlink requests

      - name: Generate M3U Playlist
        working-directory: padang-tv
        run: python playlist.py

      - name: Commit and Push Stream Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add padang-tv/
          git pull --rebase origin main --autostash
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto refresh Padang TV Playlist [skip ci]" && git push origin main)
