name: Padang TV EPG

on:
  repository_dispatch:
    types: [run-padang-epg]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: padang-tv
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate XMLTV EPG
        working-directory: padang-tv
        run: python epg.py

      - name: Commit and Push EPG Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main --autostash
          git add padang-tv/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto refresh Padang TV EPG [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main --autostash && git push origin main && break
              echo "Push rejected, retrying in 3 seconds ($i/5)..."
              sleep 3
            done
          )
