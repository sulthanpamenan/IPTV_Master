name: EPG XMLTV

on:
  repository_dispatch:
    types: [run-epg]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run EPG Generator
        env:
          GITHUB_TOKEN: ${{ secrets.INDONESIANA_TV_TOKEN }}
          GIST_ID: ${{ secrets.GIST_INDONESIANA_TV }}
        run: python epg.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epg.xml
          git diff --quiet && git diff --staged --quiet && if git diff --cached --quiet || (git commit -m "Auto-update EPG XMLTV [skip ci]" && git pull --rebase origin main && git push) echo "No changes to commit."
