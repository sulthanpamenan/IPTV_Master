name: EPG XMLTV

on:
  repository_dispatch:
    types: [run-epg]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run EPG Generator
        env:
          GITHUB_TOKEN: ${{ secrets.INDONESIANA_TV_TOKEN }}
          GIST_ID: ${{ secrets.GIST_INDONESIANA_TV }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python epg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main --autostash
          git add epg.xml
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update EPG XMLTV [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main --autostash && git push origin main && break
              echo "Push rejected, retrying in 3 seconds ($i/5)..."
              sleep 3
            done
          )
