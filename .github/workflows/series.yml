name: Series Playlist

on:
  repository_dispatch:
    types: [run-series]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: vod
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Series Generator
        working-directory: vod
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python series.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main --autostash
          git add vod/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update series.m3u and cache [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main --autostash && git push origin main && break
              echo "Push rejected, retrying in 3 seconds ($i/5)..."
              sleep 3
            done
          )
