name: Transmedia EPG

on:
  repository_dispatch:
    types: [run-transmedia-epg]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install requests beautifulsoup4 cloudscraper
          python transmedia/epg.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git pull --rebase origin main --autostash
          git add transmedia/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update Transmedia EPG [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main --autostash && git push origin main && break
              echo "Push rejected, retrying in 3 seconds ($i/5)..."
              sleep 3
            done
          )
